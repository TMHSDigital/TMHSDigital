name: Profile Cards

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: TMHSDigital
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0077B6&color_dots=#ebedf0,#b3dff5,#66bfeb,#1a97d9,#0077B6
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00A0F0&color_dots=#161b22,#0b3550,#0b5a86,#0a7fbd,#00A0F0

      - name: Metrics cards (streak, overview, activity; dark + light)
        run: python3 .github/scripts/profile_cards.py dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
