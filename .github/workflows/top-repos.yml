name: Top Repos

on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:

concurrency:
  group: top-repos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rank repos by stars and rewrite README block
        run: python3 .github/scripts/update_top_repos.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if the top 3 changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update top repos [skip ci]"
          git push
